[workspace]

[package]
name = "sepia-server"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Sepia node — sessions, projects, events, gateway, transfer (Rust port of apps/server)"

[dependencies]
axum = { version = "0.8", features = ["http2", "macros", "multipart", "json", "query", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "normalize-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false }
base64 = "0.22"
ring = "0.17"
rand = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
mime_guess = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
all = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
similar_names = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
