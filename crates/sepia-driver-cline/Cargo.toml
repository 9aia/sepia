[package]
name = "sepia-driver-cline"
description = "Cline store driver — ~/.cline/data session dirs as a SessionRepository over the driver-wire protocol"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "sepia-driver-cline"
path = "src/bin/sepia-driver-cline.rs"

[dependencies]
sepia-core.workspace = true
sepia-driver-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
time = { workspace = true, features = ["parsing"] }
rusqlite.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
sepia-testkit.workspace = true
tempfile.workspace = true
