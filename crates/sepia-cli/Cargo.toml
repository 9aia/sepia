[package]
name = "sepia-cli"
description = "The sepia CLI — local store verbs (list/export/import/install/delete), agent config IR ops, driver discovery, and the stdio session-plane service"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "sepia"
path = "src/main.rs"

[dependencies]
sepia-core.workspace = true
sepia-acp.workspace = true
sepia-convert.workspace = true
sepia-session.workspace = true
sepia-driver-cline.workspace = true
sepia-driver-claude.workspace = true
sepia-driver-cursor.workspace = true
sepia-driver-devin.workspace = true
sepia-host.workspace = true
sepia-driver.workspace = true
sepia-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
time.workspace = true
nix = { version = "0.29", default-features = false, features = ["fs", "user"] }

[dev-dependencies]
tempfile.workspace = true
sepia-testkit.workspace = true
tokio = { workspace = true, features = ["rt"] }
