[package]
name = "sepia-cli"
description = "The sepia engine lib — local store verbs (list/export/import/install/delete), agent config IR ops, driver discovery, and the stdio session-plane service; the `sepia` command ships as a tamias bins[] shim over this lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

# No `[[bin]]` — the `sepia` command ships as the tamias pack in
# `libraries/sepia/` (a generated `bins[]` shim →
# `tamias-driver-sepia cli` → `sepia_cli::run_from`, T-012). This
# crate is the engine lib only; the e2e suite lives in
# `sepia-driver-pavo/tests/` and spawns `tamias-driver-sepia run`.

[dependencies]
sepia-core.workspace = true
sepia-acp.workspace = true
sepia-convert.workspace = true
sepia-session.workspace = true
sepia-driver-cline.workspace = true
sepia-driver-claude.workspace = true
sepia-driver-cursor.workspace = true
sepia-driver-devin.workspace = true
sepia-host.workspace = true
sepia-driver.workspace = true
sepia-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
time.workspace = true
nix = { version = "0.29", default-features = false, features = ["fs", "user"] }

[dev-dependencies]
tempfile.workspace = true
