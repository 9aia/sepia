[package]
name = "sepia-driver-pavo"
description = "tamias-driver-sepia — pavo view driver over `sepia serve` (read-only session/agent surfaces) plus engine ops dispatching to the sepia-cli lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tamias-driver-sepia"
path = "src/main.rs"

[features]
# Embedded surface (pavo-driver-kit's surface layer) — optional,
# acyclic: the driver gains an `mcp` argv verb that serves its own
# ops manifest; the standalone tamias-driver-mcp binary fronts the
# same ops without any feature. `cli` is NOT a feature: it's the
# tamias `bins[]` shim verb — an engine passthrough that needs
# nothing optional. default = view driver + `ops` manifest +
# `run`/`cli` passthroughs.
default = []
mcp = ["pavo-driver-kit/mcp"]

[dependencies]
sepia-driver.workspace = true
sepia-cli.workspace = true
clap = { version = "4" }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
# The public wire contract — git dep so `cargo install --git` and
# `cargo xtask install` work without a sibling ../pavo checkout
# (path deps break workspace resolution on a fresh clone; sepia's
# CI has no pavo checkout). `version` is the crates.io fallback.
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0" }
# Driver-authoring kit — the ndjson `serve` loop, manifest/ViewSpec/
# QueryBinding/ViewNode builders, and (feature-gated) the surface
# layer this driver's `ops`/`cli`/`mcp` surface is built on. Same git
# source as pavo-protocol (they resolve to one rev).
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0" }

[dev-dependencies]
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-sepia serve` binary.
pavo-testkit = { git = "https://github.com/9aia/pavo" }
# The engine CLI e2e suite lives here now (tests/{cli,config,
# serve,serve_full,store_verbs}.rs): the `sepia` command is a tamias
# shim → this binary's `run`/`cli` verbs, so the spawned surface
# under test is `tamias-driver-sepia` itself.
tempfile.workspace = true
sepia-testkit.workspace = true
sepia-core.workspace = true
# store_verbs drives the store adapters directly (tempfile stores).
sepia-driver-devin.workspace = true
sepia-driver-cline.workspace = true
sepia-driver-claude.workspace = true
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
