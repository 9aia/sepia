[package]
name = "sepia-telemetry"
description = "Opt-in OpenTelemetry layer over the tracing stack — OTLP export, W3C context propagation"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
# Pinned exact: 0.33.1 shipped <7 days before integration (same
# convention as `thirtyfour`). tracing-opentelemetry 0.34 pairs with
# opentelemetry 0.33.
opentelemetry = "=0.33.0"
opentelemetry_sdk = "=0.33.0"
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "trace",
] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
http = "1"
