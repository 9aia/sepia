[package]
name = "sepia-node"
description = "The headless node daemon — composes driver discovery, the control plane, the meta overlay, and the API"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sepia-acp.workspace = true
sepia-control.workspace = true
sepia-core.workspace = true
sepia-driver-host.workspace = true
sepia-driver-sdk.workspace = true
sepia-meta.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sepia-convert.workspace = true
sepia-http.workspace = true
futures.workspace = true
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }
axum = "0.8"

[dev-dependencies]
tempfile.workspace = true
sepia-driver-devin.workspace = true
sepia-testkit.workspace = true
tokio = { workspace = true, features = ["rt"] }
ureq = { version = "3", features = ["json"] }
