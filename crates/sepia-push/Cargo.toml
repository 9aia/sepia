[package]
name = "sepia-push"
description = "Web Push notifications over the meta store — VAPID keys persist in config; subscriptions prune on 404/410"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sepia-meta.workspace = true
sepia-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
web-push = { version = "0.11", features = ["isahc-client"] }
futures = "0.3"

[dev-dependencies]
tempfile.workspace = true
