[package]
name = "sepia-web"
description = "Leptos UI for Sepia — session list, session detail, and live chat over the node API"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

# `cdylib` so the `hydrate` feature build produces a wasm-bindgen library.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Browser build: wasm-bindgen hydration entry + DOM/SSE access.
hydrate = [
  "leptos/hydrate",
  "leptos_toaster/hydrate",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
  "dep:web-sys",
  "dep:console_error_panic_hook",
]
# Server build: SSR rendering + server functions + the node HTTP client.
ssr = [
  "leptos/ssr",
  "leptos-use/ssr",
  "leptos_toaster/ssr",
  "leptos-fetch/ssr",
  "leptos_router/ssr",
  "leptos_meta/ssr",
  "dep:async-trait",
  "dep:tokio",
  "dep:ureq",
]

[dependencies]
leptos.workspace = true
leptos_router.workspace = true
leptos_meta.workspace = true
sepia-core.workspace = true
sepia-proto.workspace = true
sepia-web-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# hydrate-only
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "Clipboard",
  "Element",
  "ErrorEvent",
  "EventSource",
  "HtmlElement",
  "HtmlTextAreaElement",
  "MessageEvent",
  "Navigator",
  "PushEncryptionKeyName",
  "PushManager",
  "PushSubscription",
  "PushSubscriptionOptionsInit",
  "ServiceWorkerContainer",
  "ServiceWorkerRegistration",
  "Window",
] }
console_error_panic_hook = { workspace = true, optional = true }

# ssr-only
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
leptos_ui = "0.3.22"
tw_merge = "0.1"
leptos-use = { version = "0.19", default-features = false, features = [
  "use_event_source", "use_interval_fn", "use_event_listener",
  "on_click_outside", "use_media_query", "use_timeout_fn", "storage",
] }
leptos-fetch = "0.4"
leptos_toaster = { version = "0.3", default-features = false, features = ["builtin_toast"] }
floating-ui-leptos = "0.6"
