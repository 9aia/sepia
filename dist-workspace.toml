[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support — none: releases are operator-driven via
# `dist build` in scripts/release.sh (dist 0.33 rejects "none").
ci = []
# The installers to generate for each app — none: the "shell"
# installer makes dist 0.33 panic on this virtual workspace (same as
# tamias); archives are enough.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
# host arch only; other targets join via remote workers (TODO)
targets = ["x86_64-unknown-linux-gnu"]
