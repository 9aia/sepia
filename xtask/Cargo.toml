[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# Not `xtask`: under a shared CARGO_TARGET_DIR another workspace's
# same-named binary wins the fingerprint check and cargo runs *its*
# xtask. A unique bin name makes the artifact collision-proof.
[[bin]]
name = "sepia-xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json.workspace = true
