[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/9aia/sepia"

[workspace.dependencies]
# Internal crates.
sepia-core = { path = "crates/sepia-core" }
sepia-proto = { path = "crates/sepia-proto" }
sepia-acp = { path = "crates/sepia-acp" }
sepia-control = { path = "crates/sepia-control" }
sepia-convert = { path = "crates/sepia-convert" }
sepia-driver-cline = { path = "crates/sepia-driver-cline" }
sepia-driver-claude = { path = "crates/sepia-driver-claude" }
sepia-driver-cursor = { path = "crates/sepia-driver-cursor" }
sepia-driver-devin = { path = "crates/sepia-driver-devin" }
sepia-meta = { path = "crates/sepia-meta" }
sepia-node = { path = "crates/sepia-node" }
sepia-http = { path = "crates/sepia-http" }
sepia-outbox = { path = "crates/sepia-outbox" }
sepia-push = { path = "crates/sepia-push" }
sepia-sync = { path = "crates/sepia-sync" }
sepia-web = { path = "crates/sepia-web" }
sepia-web-core = { path = "crates/sepia-web-core" }
sepia-hub = { path = "crates/sepia-hub" }
sepia-driver-sdk = { path = "crates/sepia-driver-sdk" }
sepia-driver-host = { path = "crates/sepia-driver-host" }
sepia-testkit = { path = "crates/sepia-testkit" }

# External dependencies — pin conservative majors/minors.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = [
  "signal",
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "io-std",
  "sync",
  "time",
  "fs",
] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
semver = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
camino = { version = "1", features = ["serde1"] }
ureq = { version = "3", features = ["json"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
leptos = { version = "0.8.21", default-features = false }
leptos_router = { version = "0.8.17", default-features = false }
leptos_meta = { version = "0.8.7", default-features = false }
leptos_axum = "0.8.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1"
insta = { version = "1", features = ["json", "redactions"] }
# Browser e2e (sepia-hub tests). Pinned exact: 0.37.6+ shipped <7 days ago.
thirtyfour = "=0.37.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Hard gates: deny classes that hide real bugs.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
# Warn-level signal, fixed as we go.
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Pedantic lints that cost more than they catch here.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# `leptos_ui::variants!` derives Clone on Copy types inside its expansion.
expl_impl_clone_on_copy = "allow"
cast_lossless = "allow"
struct_excessive_bools = "allow"

[profile.dev]
# Line tables only: backtraces still symbolize, but test-binary links
# and disk usage drop sharply (full-debuginfo target/ was 25 GB).
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false # dependencies don't need debuginfo

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release]
# Thin LTO for local `cargo xtask install` + the wasm site build —
# shipped binaries go through `cargo build --profile dist` (release.yml).
lto = "thin"
strip = true
panic = "unwind" # keep unwind: tests + tokio supervise panics

[profile.dist]
# What we ship: maximum optimization, one codegen unit.
inherits = "release"
lto = "fat"
codegen-units = 1
