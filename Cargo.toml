[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/9aia/sepia"
description = "The agent-session abstraction — one canonical IR, store drivers, and an ACP client for every agent"

[workspace.dependencies]
# Internal crates.
sepia-core = { path = "crates/sepia-core", version = "0.2.0" }
sepia-proto = { path = "crates/sepia-proto", version = "0.2.0" }
sepia-acp = { path = "crates/sepia-acp", version = "0.2.0" }
sepia-session = { path = "crates/sepia-session", version = "0.2.0" }
sepia-convert = { path = "crates/sepia-convert", version = "0.2.0" }
sepia-driver-cline = { path = "crates/sepia-driver-cline", version = "0.2.0" }
sepia-driver-claude = { path = "crates/sepia-driver-claude", version = "0.2.0" }
sepia-driver-cursor = { path = "crates/sepia-driver-cursor", version = "0.2.0" }
sepia-driver-devin = { path = "crates/sepia-driver-devin", version = "0.2.0" }
sepia-driver-pavo = { path = "crates/sepia-driver-pavo", version = "0.2.0" }
sepia-cli = { path = "crates/sepia-cli", version = "0.2.0" }
sepia-meta = { path = "crates/sepia-meta", version = "0.2.0" }
sepia-driver = { path = "crates/sepia-driver", version = "0.2.0" }
sepia-host = { path = "crates/sepia-host", version = "0.2.0" }
sepia-testkit = { path = "crates/sepia-testkit", version = "0.2.0" }
sepia-telemetry = { path = "crates/sepia-telemetry", version = "0.2.0" }
sepia-peregrin = { path = "crates/sepia-peregrin", version = "0.2.0" }

# External dependencies — pin conservative majors/minors.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = [
  "signal",
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "io-std",
  "sync",
  "time",
  "fs",
] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
semver = "1"
toml = "0.8"
rusqlite = { version = "0.32" }
camino = { version = "1", features = ["serde1"] }
ureq = { version = "3", features = ["json"] }
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1"
insta = { version = "1", features = ["json", "redactions"] }
axum = "0.8"
form_urlencoded = "1"
# hypha — the substrate `sepia-peregrin`'s server-side entity plane
# plugs into (PL-005). Git dep on `main`, same pattern peregrin uses
# for sepia.
hypha-http = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
# `cfg(coverage)` is set by cargo-llvm-cov during instrumented runs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
# Hard gates: deny classes that hide real bugs.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
# Warn-level signal, fixed as we go.
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Pedantic lints that cost more than they catch here.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# `leptos_ui::variants!` derives Clone on Copy types inside its expansion.
expl_impl_clone_on_copy = "allow"
cast_lossless = "allow"
struct_excessive_bools = "allow"

[profile.dev]
# Line tables only: backtraces still symbolize, but test-binary links
# and disk usage drop sharply (full-debuginfo target/ was 25 GB).
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false # dependencies don't need debuginfo

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release]
# Thin LTO for local `cargo xtask install` — shipped binaries go
# through `cargo build --profile dist` (scripts/release.sh).
lto = "thin"
strip = true
panic = "unwind" # keep unwind: tests + tokio supervise panics

[profile.dist]
# What we ship: maximum optimization, one codegen unit.
inherits = "release"
lto = "fat"
codegen-units = 1
