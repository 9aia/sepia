name: ci

on:
  push:
  pull_request:

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # `vp` resolves from node_modules/.bin; `ready` runs check + tests + build.
      - run: bun run ready
