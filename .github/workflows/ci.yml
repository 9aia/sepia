name: ci

on:
  push:
  pull_request:

# One live run per branch: a push to a PR branch and that PR's own
# synchronize run land in the same group, so only the newest survives.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - run: cargo nextest run --workspace --locked
      # nextest does not run doctests.
      - run: cargo test --doc --workspace --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          # .cargo/config.toml sets rustc-wrapper = sccache.
          tool: cargo-llvm-cov, cargo-nextest, sccache
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - run: cargo xtask coverage --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
